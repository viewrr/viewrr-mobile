name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (commonTest)
    # commonTest runs as JVM android host tests — no Xcode/iOS link needed, so a cheap
    # Linux runner works (the iOS test target needs Xcode 26+ for the CMP UIKit link).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run commonTest unit suite (JVM host)
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/test-results/**/*.xml
          if-no-files-found: ignore
